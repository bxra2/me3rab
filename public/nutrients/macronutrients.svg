<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      .bg{fill:#f7f4ed}.ink{fill:#263238}.muted{fill:#59666b}
      .title{font:700 38px 'DejaVu Sans',sans-serif;letter-spacing:1px}
      .sub{font:16px 'DejaVu Sans',sans-serif}
      .head{font:700 22px 'DejaVu Sans',sans-serif}
      .label{font:700 16px 'DejaVu Sans',sans-serif}
      .body{font:15px 'DejaVu Sans',sans-serif}
      .small{font:13px 'DejaVu Sans',sans-serif}
      .tiny{font:12px 'DejaVu Sans',sans-serif}
      .card{fill:#fffdf8;stroke:#b9b6aa;stroke-width:1.5}
      .carb{stroke:#b47b35}.protein{stroke:#527c8d}.fat{stroke:#9a6b83}
      .carbfill{fill:#f4e7d0}.proteinfill{fill:#e1edf0}.fatfill{fill:#f0e3eb}
      .line{fill:none;stroke:#8b918e;stroke-width:2}
      .pill{fill:#fffdf8;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1180"/>
  <text x="800" y="62" text-anchor="middle" class="title ink">MACRONUTRIENTS</text>
  <text x="800" y="92" text-anchor="middle" class="sub muted">Nutrients required in relatively large amounts • structure, classification, functions and energy</text>

  <!-- Core definition -->
  <rect x="500" y="120" width="600" height="78" rx="14" class="card"/>
  <text x="800" y="151" text-anchor="middle" class="label ink">MACRONUTRIENTS</text>
  <text x="800" y="177" text-anchor="middle" class="body muted">Supply energy and/or materials for growth, repair and normal body function</text>
  <path d="M800 198 V225 M260 225 H1340 M260 225 V250 M800 225 V250 M1340 225 V250" class="line"/>

  <!-- CARBOHYDRATES -->
  <rect x="45" y="250" width="430" height="820" rx="18" class="card carb"/>
  <rect x="45" y="250" width="430" height="72" rx="18" class="carbfill"/>
  <path d="M45 304 V322 H475 V304" fill="#f4e7d0"/>
  <text x="260" y="281" text-anchor="middle" class="head ink">CARBOHYDRATES</text>
  <text x="260" y="305" text-anchor="middle" class="small muted">4 kcal/g • primary readily available energy source</text>

  <rect x="70" y="344" width="380" height="66" rx="10" class="pill carb"/>
  <text x="260" y="371" text-anchor="middle" class="label ink">SUGARS</text>
  <text x="260" y="393" text-anchor="middle" class="small muted">Simple carbohydrates</text>
  <path d="M260 410 V430 M135 430 H385 M135 430 V447 M260 430 V447 M385 430 V447" class="line"/>

  <rect x="70" y="447" width="130" height="145" rx="9" class="card"/>
  <text x="135" y="473" text-anchor="middle" class="label ink">MONOSACCHARIDES</text>
  <text x="84" y="503" class="small ink">• Glucose</text><text x="84" y="527" class="small ink">• Fructose</text><text x="84" y="551" class="small ink">• Galactose</text>
  <text x="84" y="576" class="tiny muted">One sugar unit</text>

  <rect x="195" y="447" width="130" height="145" rx="9" class="card"/>
  <text x="260" y="473" text-anchor="middle" class="label ink">DISACCHARIDES</text>
  <text x="208" y="503" class="small ink">• Sucrose</text><text x="208" y="527" class="small ink">• Lactose</text><text x="208" y="551" class="small ink">• Maltose</text>
  <text x="208" y="576" class="tiny muted">Two sugar units</text>

  <rect x="320" y="447" width="130" height="145" rx="9" class="card"/>
  <text x="385" y="473" text-anchor="middle" class="label ink">POLYOLS</text>
  <text x="333" y="503" class="small ink">• Sorbitol</text><text x="333" y="527" class="small ink">• Mannitol</text><text x="333" y="551" class="small ink">• Xylitol</text>
  <text x="333" y="576" class="tiny muted">Sugar alcohols</text>

  <rect x="70" y="615" width="380" height="64" rx="10" class="pill carb"/>
  <text x="260" y="642" text-anchor="middle" class="label ink">POLYSACCHARIDES</text>
  <text x="260" y="664" text-anchor="middle" class="small muted">Complex carbohydrates • many sugar units</text>
  <path d="M260 679 V699 M150 699 H370 M150 699 V716 M260 699 V716 M370 699 V716" class="line"/>

  <rect x="70" y="716" width="160" height="135" rx="9" class="card"/>
  <text x="150" y="744" text-anchor="middle" class="label ink">STARCH</text>
  <text x="84" y="773" class="small ink">• Amylose</text><text x="84" y="797" class="small ink">• Amylopectin</text>
  <text x="84" y="830" class="tiny muted">Plant energy store</text>

  <rect x="230" y="716" width="110" height="135" rx="9" class="card"/>
  <text x="285" y="744" text-anchor="middle" class="label ink">GLYCOGEN</text>
  <text x="244" y="777" class="small ink">Stored in</text><text x="244" y="800" class="small ink">liver &amp;</text><text x="244" y="823" class="small ink">muscles</text>

  <rect x="340" y="716" width="110" height="135" rx="9" class="card"/>
  <text x="395" y="744" text-anchor="middle" class="label ink">FIBRE</text>
  <text x="352" y="777" class="small ink">• Soluble</text><text x="352" y="800" class="small ink">• Insoluble</text>
  <text x="352" y="830" class="tiny muted">Not fully digested</text>

  <rect x="70" y="875" width="380" height="165" rx="10" class="carbfill" stroke="#b47b35"/>
  <text x="90" y="904" class="label ink">KEY ROLES</text>
  <text x="90" y="932" class="body ink">• Glucose fuels cells; excess can be stored</text>
  <text x="90" y="957" class="body ink">• Fibre supports bowel and gut health</text>
  <text x="90" y="982" class="body ink">• Glycogen is the storage form in animals</text>
  <text x="90" y="1015" class="small muted">Digestion: carbohydrates → simple sugars</text>

  <!-- PROTEINS -->
  <rect x="585" y="250" width="430" height="820" rx="18" class="card protein"/>
  <rect x="585" y="250" width="430" height="72" rx="18" class="proteinfill"/>
  <path d="M585 304 V322 H1015 V304" fill="#e1edf0"/>
  <text x="800" y="281" text-anchor="middle" class="head ink">PROTEINS</text>
  <text x="800" y="305" text-anchor="middle" class="small muted">4 kcal/g • growth, maintenance and repair</text>

  <rect x="610" y="344" width="380" height="78" rx="10" class="pill protein"/>
  <text x="800" y="374" text-anchor="middle" class="label ink">AMINO ACIDS</text>
  <text x="800" y="399" text-anchor="middle" class="small muted">Building blocks joined by peptide bonds</text>
  <path d="M800 422 V448 M690 448 H910 M690 448 V466 M910 448 V466" class="line"/>

  <rect x="610" y="466" width="170" height="155" rx="9" class="card"/>
  <text x="695" y="493" text-anchor="middle" class="label ink">ESSENTIAL</text>
  <text x="625" y="522" class="small ink">Must come from</text><text x="625" y="545" class="small ink">the diet</text>
  <text x="625" y="581" class="tiny muted">9 in adults</text>
  <text x="625" y="602" class="tiny muted">e.g. lysine, leucine</text>

  <rect x="830" y="466" width="160" height="155" rx="9" class="card"/>
  <text x="910" y="493" text-anchor="middle" class="label ink">NON-ESSENTIAL</text>
  <text x="845" y="522" class="small ink">Can generally be</text><text x="845" y="545" class="small ink">made by the body</text>
  <text x="845" y="581" class="tiny muted">e.g. alanine,</text><text x="845" y="602" class="tiny muted">aspartic acid</text>

  <rect x="610" y="645" width="380" height="66" rx="10" class="pill protein"/>
  <text x="800" y="673" text-anchor="middle" class="label ink">PROTEIN QUALITY</text>
  <text x="800" y="695" text-anchor="middle" class="small muted">Based on amino-acid profile and digestibility</text>
  <path d="M800 711 V733 M690 733 H910 M690 733 V751 M910 733 V751" class="line"/>

  <rect x="610" y="751" width="170" height="120" rx="9" class="card"/>
  <text x="695" y="780" text-anchor="middle" class="label ink">COMPLETE</text>
  <text x="625" y="811" class="small ink">All 9 essential</text><text x="625" y="834" class="small ink">amino acids in</text><text x="625" y="857" class="small ink">adequate amounts</text>

  <rect x="830" y="751" width="160" height="120" rx="9" class="card"/>
  <text x="910" y="780" text-anchor="middle" class="label ink">INCOMPLETE</text>
  <text x="845" y="811" class="small ink">One or more</text><text x="845" y="834" class="small ink">essential amino</text><text x="845" y="857" class="small ink">acids are limiting</text>

  <rect x="610" y="895" width="380" height="145" rx="10" class="proteinfill" stroke="#527c8d"/>
  <text x="630" y="924" class="label ink">KEY ROLES</text>
  <text x="630" y="952" class="body ink">• Enzymes, hormones and antibodies</text>
  <text x="630" y="977" class="body ink">• Muscle and tissue structure / repair</text>
  <text x="630" y="1002" class="body ink">• Transport and cell signalling</text>
  <text x="630" y="1025" class="small muted">Digestion: proteins → peptides → amino acids</text>

  <!-- FATS -->
  <rect x="1125" y="250" width="430" height="820" rx="18" class="card fat"/>
  <rect x="1125" y="250" width="430" height="72" rx="18" class="fatfill"/>
  <path d="M1125 304 V322 H1555 V304" fill="#f0e3eb"/>
  <text x="1340" y="281" text-anchor="middle" class="head ink">FATS / LIPIDS</text>
  <text x="1340" y="305" text-anchor="middle" class="small muted">9 kcal/g • concentrated energy and cell structure</text>

  <rect x="1150" y="344" width="380" height="76" rx="10" class="pill fat"/>
  <text x="1340" y="373" text-anchor="middle" class="label ink">TRIGLYCERIDES</text>
  <text x="1340" y="398" text-anchor="middle" class="small muted">Glycerol + 3 fatty acids • main dietary/storage fat</text>
  <path d="M1340 420 V443 M1225 443 H1455 M1225 443 V461 M1340 443 V461 M1455 443 V461" class="line"/>

  <rect x="1150" y="461" width="150" height="164" rx="9" class="card"/>
  <text x="1225" y="489" text-anchor="middle" class="label ink">SATURATED</text>
  <text x="1164" y="520" class="small ink">No double bonds</text>
  <text x="1164" y="550" class="tiny muted">Often solid at</text><text x="1164" y="570" class="tiny muted">room temperature</text>
  <text x="1164" y="605" class="tiny muted">e.g. butter</text>

  <rect x="1300" y="461" width="150" height="164" rx="9" class="card"/>
  <text x="1375" y="489" text-anchor="middle" class="label ink">UNSATURATED</text>
  <text x="1314" y="520" class="small ink">One or more</text><text x="1314" y="543" class="small ink">double bonds</text>
  <text x="1314" y="579" class="tiny muted">Usually liquid</text><text x="1314" y="599" class="tiny muted">at room temp.</text>

  <rect x="1450" y="461" width="80" height="164" rx="9" class="card"/>
  <text x="1490" y="489" text-anchor="middle" class="label ink">TRANS</text>
  <text x="1461" y="520" class="tiny ink">Unsaturated</text><text x="1461" y="540" class="tiny ink">fat with</text><text x="1461" y="560" class="tiny ink">trans bond</text>
  <text x="1461" y="600" class="tiny muted">Limit intake</text>

  <path d="M1375 625 V648 M1320 648 H1430 M1320 648 V665 M1430 648 V665" class="line"/>
  <rect x="1300" y="665" width="150" height="105" rx="9" class="card"/>
  <text x="1375" y="692" text-anchor="middle" class="label ink">MONO-</text>
  <text x="1375" y="713" text-anchor="middle" class="label ink">UNSATURATED</text>
  <text x="1314" y="744" class="tiny muted">One double bond</text>
  <rect x="1450" y="665" width="80" height="105" rx="9" class="card"/>
  <text x="1490" y="692" text-anchor="middle" class="label ink">POLY-</text>
  <text x="1490" y="713" text-anchor="middle" class="label ink">UNSAT.</text>
  <text x="1460" y="744" class="tiny muted">2+ bonds</text>

  <rect x="1150" y="800" width="380" height="84" rx="10" class="pill fat"/>
  <text x="1340" y="830" text-anchor="middle" class="label ink">ESSENTIAL FATTY ACIDS</text>
  <text x="1340" y="855" text-anchor="middle" class="small muted">Omega-3 (e.g. ALA) • Omega-6 (e.g. LA)</text>

  <rect x="1150" y="904" width="380" height="136" rx="10" class="fatfill" stroke="#9a6b83"/>
  <text x="1170" y="933" class="label ink">OTHER LIPID TYPES &amp; ROLES</text>
  <text x="1170" y="959" class="body ink">• Phospholipids: cell membranes</text>
  <text x="1170" y="984" class="body ink">• Sterols (e.g. cholesterol): membranes</text>
  <text x="1170" y="1009" class="body ink">• Insulation, organ protection, vitamins A/D/E/K</text>
  <text x="1170" y="1030" class="small muted">Digestion: triglycerides → fatty acids + monoglycerides</text>

  <!-- Footer -->
  <path d="M45 1090 H1555" stroke="#c5c0b4" stroke-width="1.5"/>
  <text x="800" y="1120" text-anchor="middle" class="label ink">ENERGY VALUE (APPROXIMATE)</text>
  <text x="800" y="1150" text-anchor="middle" class="body muted">Carbohydrate 4 kcal/g  •  Protein 4 kcal/g  •  Fat 9 kcal/g</text>
  <text x="800" y="1172" text-anchor="middle" class="tiny muted">Water is essential but provides no energy; vitamins and minerals are micronutrients.</text>
</svg>